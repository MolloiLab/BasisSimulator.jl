# Sidecar environment for the LOCAL notebook export pipeline (docs/extract_all.jl).
# Lives separate from docs/Project.toml so the export driver's deps don't weigh on
# the notebook runtime — notebooks self-activate docs/Project.toml when they run.
#
# Exports go through Snapshot.jl's LEAN Therapy emit (therapy=true): rendered cell
# outputs as plain HTML + WASM islands where compilable — NO embedded Pluto statefile
# (the old Pluto.generate_html path baked 17-42 MB of state into every page).
#
# [sources] are LOCAL PATHS (this env only ever runs on the dev machine — that's the
# whole point: the notebooks need Metal, so rendering is local and CI just mounts the
# committed HTML). Layout assumption: GroupTherapyOrg/ is a sibling of MolloiLab/.
# WasmTarget must be pinned HERE too — [sources] only apply from the root project, so
# Snapshot.jl's own WasmTarget pin doesn't propagate.

[deps]
Pluto = "c3e4b0f8-55cb-11ea-2926-15256bba5781"
SHA = "ea8e919c-243c-51af-8825-aaa63cd721ce"
Snapshot = "1e64ef43-5f79-4f6b-8e97-159df4e27032"
WasmTarget = "9f3a1415-1112-405b-ae89-c61daf9872bd"

[sources]
Snapshot = {path = "../../../../GroupTherapyOrg/Snapshot.jl"}
WasmTarget = {path = "../../../../GroupTherapyOrg/WasmTarget.jl"}
