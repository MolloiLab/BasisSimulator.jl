# Phantom configuration - Water cylinder
# Simple water cylinder for cross-validation

phantom.callback = "Phantom_Analytic"       # use analytical phantom (fast)
phantom.projectorCallback = "C_Projector_Analytic"
phantom.filename = "water_cylinder.ppm"     # phantom parameter file
phantom.centerOffset = [0.0, 0.0, 0.0]      # mm
phantom.scale = 1.0
