# Protocol configuration - Simple axial scan
# Matches BasisSimulator default settings

protocol.scanTypes = [0, 0, 1, 1]           # [air, offset, phantom, prep] - skip air/offset for simplicity

# Table and gantry
protocol.scanTrajectory = "Gantry_Helical"
protocol.viewsPerRotation = 360             # 360 projections (can adjust)
protocol.viewCount = 360
protocol.startViewId = 0
protocol.stopViewId = protocol.viewCount-1
protocol.airViewCount = 1
protocol.offsetViewCount = 1
protocol.rotationTime = 1.0                 # seconds
protocol.rotationDirection = 1              # CW
protocol.startAngle = 0                     # degrees
protocol.tableSpeed = 0                     # mm/sec (axial scan, no table motion)
protocol.startZ = 0
protocol.tiltAngle = 0                      # degrees
protocol.wobbleDistance = 0.0
protocol.focalspotOffset = [0, 0, 0]

# X-ray tube technique
protocol.mA = 200                           # tube current
protocol.spectrumCallback = "Spectrum"
protocol.spectrumFilename = "tungsten_tar7.0_120_filt.dat"  # 120 kVp spectrum
protocol.spectrumScaling = 1.0
protocol.spectrumUnit_mm = 0
protocol.spectrumUnit_mA = 1
protocol.bowtie = []                        # no bowtie filter
protocol.filterCallback = "Xray_Filter"
protocol.flatFilter = []                    # no additional filtration (spectrum file has filtration)
protocol.dutyRatio = 1.0

# Pre/post-log
protocol.maxPrep = 9
