# Scanner geometry - Canon Aquilion ONE equivalent
# Matches BasisSimulator Canon Aquilion ONE configuration

scanner.detectorCallback = "Detector_ThirdgenCurved"
scanner.sid = 600.0                         # source-to-iso distance (mm) - matches BasisSimulator SAD
scanner.sdd = 1000.0                        # source-to-detector distance (mm) - matches BasisSimulator SDD
scanner.detectorColsPerMod = 1
scanner.detectorRowsPerMod = 320
scanner.detectorColOffset = 0.0
scanner.detectorRowOffset = 0.0
scanner.detectorColSize = 0.5               # detector column pitch (mm) - matches BasisSimulator
scanner.detectorRowSize = 0.5               # detector row pitch (mm) - matches BasisSimulator
scanner.detectorColCount = 800              # total number of detector columns - matches BasisSimulator
scanner.detectorRowCount = scanner.detectorRowsPerMod  # 320 rows
scanner.detectorPrefilter = []              # no pre-filter for simplicity

# X-ray tube (simple model)
scanner.focalspotCallback = "SetFocalspot"
scanner.focalspotShape = "Uniform"
scanner.targetAngle = 7.0                   # degrees
scanner.focalspotWidth = 1.0                # mm
scanner.focalspotLength = 1.0               # mm

# Detector (simple model)
scanner.detectorMaterial = "Lumex"
scanner.detectorDepth = 3.0                 # mm
scanner.detectionCallback = "Detection_EI"  # energy-integrating
scanner.detectionGain = 15.0                # electrons / keV
scanner.detectorColFillFraction = 1.0       # 100% fill (ideal detector)
scanner.detectorRowFillFraction = 1.0
scanner.eNoise = 0.0                        # no electronic noise for now (added separately in physics)
