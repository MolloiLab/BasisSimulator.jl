# Physics configuration - Simple settings to match BasisSimulator

# Sampling
physics.energyCount = 20                    # number of energy bins - matches BasisSimulator spectrum
physics.monochromatic = -1                  # polychromatic
physics.colSampleCount = 1                  # detector sub-pixels (1 = no sub-sampling for speed)
physics.rowSampleCount = 1
physics.srcXSampleCount = 1                 # focal spot sub-pixels (1 = point source)
physics.srcYSampleCount = 1
physics.viewSampleCount = 1                 # temporal sub-sampling

# Recalculation flags (optimize for speed)
physics.recalcDet = 0
physics.recalcSrc = 0
physics.recalcGantry = 2                    # recalc gantry each subview
physics.recalcRayAngle = 0
physics.recalcSpec = 0
physics.recalcFilt = 0
physics.recalcFlux = 0
physics.recalcPht = 0

# Noise (disable for initial comparison - add later)
physics.enableQuantumNoise = 0             # disable for deterministic comparison
physics.enableElectronicNoise = 0

# Physics callbacks
physics.rayAngleCallback = "Detector_RayAngles_2D"
physics.fluxCallback = "Detection_Flux"
physics.scatterCallback = ""                # no scatter
physics.prefilterCallback = "Detection_prefilter"
physics.crosstalkCallback = ""              # no crosstalk
physics.lagCallback = ""                    # no lag
physics.opticalCrosstalkCallback = ""       # no optical crosstalk
physics.DASCallback = "Detection_DAS"

# I/O
physics.outputCallback = "WriteRawView"
