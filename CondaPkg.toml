# CondaPkg.jl configuration for BasisSimulator.jl
# Manages Python dependencies for GECATSIM cross-validation

# Use conda-forge for better package availability
channels = ["conda-forge"]

[deps]
# Core Python packages
numpy = ""
scipy = ""
matplotlib = ""

# Note: GECATSIM will be installed via pip using scripts/install_gecatsim.jl
# It cannot be specified here because CondaPkg doesn't support git URLs in TOML
