name: Build and Deploy Docs

# The site is built from `main` whenever a push changes the docs, the code or Project.toml, or
# lib/BasisMonteCarlo (whose notebooks are the Examples' "Detector physics" pages), or by hand from
# the Actions tab, for any commit. No release is needed. The notebook pages are the committed,
# pre-rendered exports in docs/notebooks-static/; `docs/build.sh` refuses exports that are stale
# against the code being built (RELEASING.md, "The docs site").

on:
  push:
    branches: [main]
    paths: ["docs/**", "src/**", "Project.toml", "lib/BasisMonteCarlo/**", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build (default: main)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the commit to document
        run: |
          ref="${{ github.event.inputs.ref }}"
          [ -n "$ref" ] || ref="${{ github.sha }}"
          echo "Building the docs of $ref"
          git checkout --quiet "$ref"

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - name: Build docs
        run: docs/build.sh

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
