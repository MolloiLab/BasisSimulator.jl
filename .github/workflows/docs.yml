name: Build and Deploy Docs

# The site describes the latest release: it is built from the newest `v*` tag, after TagBot has
# created it (or by hand from the Actions tab), never from `main`. The notebook pages are the
# committed, GPU-rendered exports in docs/notebooks-static/, re-rendered in each release pull
# request (RELEASING.md); `docs/build.sh` refuses a tag whose exports are stale.

on:
  workflow_run:
    workflows: [TagBot]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to build (default: the newest v* tag)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out the release to document
        run: |
          ref="${{ github.event.inputs.ref }}"
          [ -n "$ref" ] || ref="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          echo "Building the docs of $ref"
          git checkout --quiet "$ref"

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - name: Build docs
        run: docs/build.sh

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
