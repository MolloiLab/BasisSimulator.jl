name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A named version, not '1'. '1' tracks the newest stable, which became 1.13 on
        # 2026-09-17, and the dependency tree cannot resolve there: XrayAttenuation is
        # registered as `julia = "1.10 - 1.12"`, so buildpkg fails before a single test runs.
        # Below is closed too: the bundled `cdte_response_v4.jls` is in 1.12's serialization
        # format, so 1.11 errors in every MC-response test. 1.12 is the whole supported window,
        # which is what `Project.toml` now declares and what `docs.yml` pins.
        version:
          - '1.12'
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        arch:
          - x64
        exclude:
          # macOS-14+ runners are Apple Silicon (arm64) only.
          - os: macos-latest
            arch: x64
        include:
          - os: macos-latest
            arch: arm64
            version: '1.12'

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
        env:
          JULIA_NUM_THREADS: 2

      - uses: julia-actions/julia-processcoverage@v1

      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
