# Standard Julia TagBot.  Kept alongside release-please as a fallback:
# - release-please tags + creates the GitHub Release immediately when the
#   release PR merges, which is the common path.
# - TagBot still listens for `JuliaRegistrator` registrator-comment events
#   on the registry side; if release-please ever fails to tag a release
#   (e.g. action outage), TagBot will pick it up after the registry merges.

name: TagBot

on:
  issue_comment:
    types:
      - created
  workflow_dispatch:
    inputs:
      lookback:
        default: "3"

permissions:
  actions: read
  checks: read
  contents: write
  deployments: read
  issues: read
  discussions: read
  packages: read
  pages: read
  pull-requests: read
  repository-projects: read
  security-events: read
  statuses: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
