# Brain Perfusion CT Simulation Configuration
# 
# Usage:
#   1. Edit this config file for your phantom
#   2. Run: julia 06_brain_perfusion.jl --config brain_perfusion_config.toml
#   3. Or override on command line: julia 06_brain_perfusion.jl --phantom P2.raw

# =============================================================================
# Phantom Configuration
# =============================================================================
[phantom]
# Path to phantom file (auto-detect dimensions from filename if possible)
# Supported formats: .raw, .bin, .mat
phantom_file = "phantom_400_400_400.raw"

# Phantom dimensions (optional - auto-detected from filename if not specified)
# dims = [400, 400, 400]

# Data type: UInt8 or UInt16
data_type = "UInt16"

# Voxel size in cm (optional - computed from FOV if not specified)
# voxel_size = [0.2, 0.2, 0.2]

# Base FOV in cm for computing voxel size (if not specified)
base_fov_cm = [80.0, 80.0, 80.0]

# Downsample factor for faster simulation (1 = original, 2 = 2x faster, etc.)
downsample_factor = 1

# =============================================================================
# Perfusion Simulation Parameters
# =============================================================================
[perfusion]
# Time points in seconds (contrast arrival simulation)
time_points = [0.0, 10.0, 20.0, 30.0, 40.0, 50.0, 60.0, 70.0, 80.0]

# Iodine concentration in mg/g for each time point
# These will be applied to blood vessels
arterial_concentrations = [0.0, 0.5, 2.0, 5.0, 4.0, 2.0, 1.0, 0.5, 0.0]
venous_concentrations = [0.0, 0.0, 0.5, 2.0, 4.0, 5.0, 3.0, 1.0, 0.0]

# Energy for attenuation calculation (keV)
energy_keV = 60.0

# Region IDs to apply contrast (blood vessels)
# Leave empty to auto-detect from semantic classification
contrast_region_ids = []

# =============================================================================
# Scanner Configuration
# =============================================================================
[scanner]
# Scanner type: "eict", "eict_dual", "pcct"
scanner_type = "pcct"

# kVp value
kVp = 120.0

# Number of views
views = 600

# Detector configuration (auto-sized from phantom if not specified)
# detector_cols = 512
# detector_rows = 64

# =============================================================================
# Simulation Options
# =============================================================================
[simulation]
# Downsample factor for resolution control (1=UHR, 2=HR, 4=Std, 5=Fast)
downsample_factor = 1

# Reconstruction matrix size (auto-matched to phantom if not specified)
# recon_xy = 512
# recon_z = 64

# FOV for reconstruction in cm
recon_fov_cm = 35.0

# Seed for reproducibility
seed = 42

# =============================================================================
# Output Configuration
# =============================================================================
[output]
# Output directory (default: ./output)
output_dir = "./output"

# Save reconstructed volumes as PNG
save_images = true

# Save raw data as JLD2
save_raw = false

# Figure format: png, pdf, jpg
figure_format = "png"
